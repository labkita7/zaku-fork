info:
  name: Dynamic Variables
  type: graphql
  seq: 26

graphql:
  method: POST
  url: https://api.example.com/graphql
  headers:
    - name: Content-Type
      value: application/json
  body:
    query: |-
      query User($userId: ID!) {
        user(id: $userId) {
          name
        }
      }
    variables: |-
      {
        "userId": "{{userId}}"
      }
